function geo(a,b){var dy=(a.lat-b.lat)*111320,dx=(a.lon-b.lon)*111320*Math.cos(a.lat*Math.PI/180);return Math.sqrt(dy*dy+dx*dx)}

var map=L.map('map').setView([45.436,4.390],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OSM',maxZoom:19}).addTo(map);

function drawRoute(pts,color,cls,offset){
  var allLatLng=[];
  for(var i=0;i<pts.length-1;i++){
    var a=pts[i],b=pts[i+1];
    var straight=geo(a,b);
    var ratio=straight>0?(b.d*1000)/straight:0;
    var isProblem=ratio>4||(b.d>0.7&&straight<300);
    var c=isProblem?'#e74c3c':color;
    var w=isProblem?5:3;
    var da=isProblem?null:(b.d>1.0?'8,6':null);
    var oLat=offset*0.00008;
    var line=L.polyline([[a.lat+oLat,a.lon],[b.lat+oLat,b.lon]],{color:c,weight:w,opacity:0.8,dashArray:da}).addTo(map);
    var info='<b>'+cls+' seg '+a.p+' → '+b.p+'</b><br>'+b.a+'<br>Route: '+b.d+'km / '+b.t+'min<br>Vol oiseau: '+Math.round(straight)+'m';
    if(ratio>3)info+='<br><b style="color:red">Ratio: '+ratio.toFixed(1)+'×</b>';
    if(isProblem)info='<span style="color:red">⚠ PROBLÈME</span><br>'+info;
    line.bindPopup(info);
    allLatLng.push([a.lat,a.lon],[b.lat,b.lon]);
  }
  for(var i=0;i<pts.length;i++){
    var p=pts[i];
    var isDepot=p.p==='D'||p.p==='A';
    var isProbPt=false;
    if(i>0){var s=geo(pts[i-1],p);var r=s>0?(p.d*1000)/s:0;isProbPt=r>4||(p.d>0.7&&s<300)}
    if(i<pts.length-1){var s2=geo(p,pts[i+1]);var r2=s2>0?(pts[i+1].d*1000)/s2:0;if(r2>4||(pts[i+1].d>0.7&&s2<300))isProbPt=true}
    var cc=isDepot?'depot-label':(cls.indexOf('T1')>=0?'t1-label':'t2-label');
    if(isProbPt&&!isDepot)cc+=' prob';
    var lbl=isDepot?(p.p==='D'?'DEP':'ARR'):(cls.charAt(1)+p.p);
    var icon=L.divIcon({className:cc,html:lbl,iconSize:[22,22],iconAnchor:[11,11]});
    L.marker([p.lat,p.lon],{icon:icon}).addTo(map).bindPopup(
      '<b>'+cls+' Point '+p.p+'</b><br>'+p.a+'<br><small>ID:'+p.id+' | '+p.lat.toFixed(5)+','+p.lon.toFixed(5)+'</small>'+(p.d>0?'<br>Depuis préc: '+p.d+'km/'+p.t+'min':'')
    );
  }
  return allLatLng;
}
